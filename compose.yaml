name: business-ledger

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-business_ledger}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ledger-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ledger-minio-local-password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger-local-password}@postgres:5432/${POSTGRES_DB:-business_ledger}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-production}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-local-field-encryption-secret-change-before-production}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-business-ledger}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ledger-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ledger-minio-local-password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["tools"]
    command: ["npm", "run", "prisma:seed", "-w", "@ledger/api"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger-local-password}@postgres:5432/${POSTGRES_DB:-business_ledger}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-production}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-local-field-encryption-secret-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  backup:
    image: postgres:16-alpine
    profiles: ["tools"]
    entrypoint: ["/opt/ledger/backup.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-business_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger-local-password}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./deploy/scripts/backup.sh:/opt/ledger/backup.sh:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  postgres_backups:
